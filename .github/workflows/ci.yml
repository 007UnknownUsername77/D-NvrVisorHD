name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python3 -m py_compile app/cam_dashboard.py app/deploy_report.py
      - run: python3 ops/check_page.py
      - run: python3 ops/secret_scan.py
      - run: python3 app/deploy_report.py
