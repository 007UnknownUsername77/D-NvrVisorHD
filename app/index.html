<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#07080c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-title" content="Visor" />
  <link rel="icon" href="./icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon.png">
  <title>Visor</title>
  <style>
    :root, html[data-theme="night"] {
      color-scheme: dark;
      --bg: #07080c;
      --panel: #10131b;
      --card: #171b26;
      --line: rgba(255,255,255,.08);
      --text: #eef1f7;
      --muted: #8e98ad;
      --accent: #4c8dff;
      --accent-2: #9ec0ff;
      --rec: #ff6436;
      --live: #3ee0a2;
      --nav-bg: #0b0d13;
      --btn-on: #1c305c;
      --btn-line: #3d6ec9;
      --track: #12151d;
      --dialog: #10131b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --nav: calc(58px + env(safe-area-inset-bottom));
      --top: calc(50px + env(safe-area-inset-top));
    }
    html[data-theme="harbor"] {
      color-scheme: dark;
      --bg: #061018; --panel: #0c1824; --card: #122232;
      --line: rgba(180,210,230,.14); --text: #e7f2f8; --muted: #8eabbd;
      --accent: #3cb6e0; --accent-2: #9adcf2;
      --nav-bg: #08141e; --btn-on: #14384a; --btn-line: #2f86a8;
      --track: #0e1c28; --dialog: #0c1824;
    }
    html[data-theme="pine"] {
      color-scheme: dark;
      --bg: #07110c; --panel: #0e1b14; --card: #14261c;
      --line: rgba(170,210,180,.14); --text: #e7f6ec; --muted: #8fb39a;
      --accent: #3cbe7a; --accent-2: #b6ebc8;
      --nav-bg: #08140e; --btn-on: #145032; --btn-line: #2f9a62;
      --track: #102016; --dialog: #0e1b14;
    }
    html[data-theme="amber"] {
      color-scheme: dark;
      --bg: #120e08; --panel: #1c150c; --card: #2a1e10;
      --line: rgba(230,190,120,.16); --text: #f8f0e2; --muted: #c2aa86;
      --accent: #e0a040; --accent-2: #f0cf96; --rec: #ff7848; --live: #d7b15a;
      --nav-bg: #160f09; --btn-on: #5a3a14; --btn-line: #c4842a;
      --track: #24180e; --dialog: #1c150c;
    }
    html[data-theme="day"] {
      color-scheme: light;
      --bg: #f4f1ea; --panel: #fffdf8; --card: #ffffff;
      --line: rgba(28,25,21,.12); --text: #1c1915; --muted: #5c6570;
      --accent: #1d4e89; --accent-2: #1d4e89; --rec: #c2410c; --live: #0f766e;
      --nav-bg: #fffdf8; --btn-on: #dbe7f6; --btn-line: #1d4e89;
      --track: #e6e1d6; --dialog: #fffdf8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font); overflow: hidden; user-select: none;
      touch-action: manipulation; -webkit-touch-callout: none;
      overscroll-behavior: none;
    }
    body.phone .app { height: var(--app-h, 100dvh); }
    button, input { font: inherit; color: inherit; }
    .app { height: 100dvh; display: flex; flex-direction: column; }
    header {
      height: var(--top); padding: env(safe-area-inset-top) 14px 0;
      display: flex; align-items: center; gap: 10px; flex: none;
    }
    header .mark {
      width: 28px; height: 28px; border-radius: 8px; flex: none; overflow: hidden;
    }
    header .mark img { width: 28px; height: 28px; display: block; border-radius: 8px; }
    .theme-pick { flex: none; }
    .theme-pick select {
      height: 28px; max-width: 7.2rem; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); padding: 0 4px; font-size: 12px;
    }
    header .titles { min-width: 0; flex: 1; }
    header strong { display: block; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }
    header span { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .clock { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

    .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
    body[data-mode="live"] #liveView,
    body[data-mode="rec"] #recView { display: flex; }

    .stage-wrap { flex: 1; min-height: 0; padding: 0 8px; position: relative; }
    .stage {
      height: 100%; background: #000; border-radius: 16px; overflow: hidden;
      position: relative; border: 1px solid var(--line); touch-action: none;
    }
    .stage.one { display: block; }
    .stage.grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-auto-rows: minmax(0, 1fr);
      gap: 3px; background: #000; padding: 3px;
    }
    .cell { position: relative; width: 100%; height: 100%; background: #05060a; min-height: 0; overflow: hidden; }
    .stage.grid .cell { border-radius: 10px; }
    .stage.grid .cell.on { outline: 2px solid var(--accent-2); outline-offset: -2px; }
    .stage.grid .tag { left: 6px; top: 6px; padding: 2px 6px; font-size: 11px; }
    .cell video-stream, .cell video, .rec-player video-stream, .rec-player video {
      width: 100% !important; height: 100% !important; display: block; background: #000;
      object-fit: contain;
    }
    .cell[data-dar], .rec-player[data-dar] {
      display: flex; align-items: center; justify-content: center;
    }
    .cell[data-dar] > video-stream, .rec-player[data-dar] > video-stream { flex: none; }
    .cell[data-dar] video, .rec-player[data-dar] video { object-fit: fill; }
    @media (max-width: 800px) {
      .btn, .chip, .span-row button { height: 44px; }
    }
    body.ios-large { background: #000; }
    body.phone .stage-wrap,
    body.phone .rec-player {
      transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.phone header,
    body.phone .film,
    body.phone .tools,
    body.phone nav,
    body.phone .rec-head,
    body.phone .timeline,
    body.phone .clips,
    body.phone .dl-box,
    body.phone .rec-status {
      transition: opacity 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.ios-large header,
    body.ios-large .film,
    body.ios-large .tools,
    body.ios-large nav,
    body.ios-large .rec-head,
    body.ios-large .timeline,
    body.ios-large .clips,
    body.ios-large .dl-box,
    body.ios-large .rec-status {
      opacity: 0;
      pointer-events: none;
    }
    body.ios-large .stage-wrap,
    body.ios-large .rec-player {
      position: fixed; z-index: 30; margin: 0; border-radius: 0;
      background: #000; box-sizing: border-box;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      opacity: 1;
      transform: translateZ(0) scale(1);
      transition: opacity 260ms cubic-bezier(0.22, 1, 0.36, 1),
                  transform 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.ios-large.ios-enter .stage-wrap,
    body.ios-large.ios-enter .rec-player,
    body.ios-large.ios-leave .stage-wrap,
    body.ios-large.ios-leave .rec-player {
      opacity: 0;
      transform: translateZ(0) scale(0.975);
    }
    body.ios-large .stage { height: 100%; border: 0; border-radius: 0; }
    .ios-close {
      position: fixed; z-index: 80;
      top: calc(8px + env(safe-area-inset-top));
      left: calc(8px + env(safe-area-inset-left));
      width: 44px; height: 44px; margin: 0; padding: 0;
      border: 0; border-radius: 22px;
      background: rgba(20,22,28,.78); color: #fff;
      font-size: 30px; line-height: 1; font-weight: 300;
      display: grid; place-items: center;
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateZ(0) scale(0.92);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 0s linear 180ms;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .ios-close::before {
      content: "";
      position: absolute;
      inset: -12px;
    }
    body.ios-large:not(.ios-enter):not(.ios-leave) .ios-close {
      opacity: 1; visibility: visible; pointer-events: auto;
      transform: translateZ(0) scale(1);
      transition: opacity 200ms ease 30ms, transform 240ms cubic-bezier(0.22, 1, 0.36, 1) 30ms, visibility 0s linear 0s;
    }
    body.ios-large:not(.ios-enter):not(.ios-leave) .ios-close:active {
      transform: translateZ(0) scale(0.9);
      background: rgba(255,255,255,.18);
    }
    body.phone video::-webkit-media-controls,
    body.phone video::-webkit-media-controls-start-playback-button,
    body.phone video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none;
    }
    @media (prefers-reduced-motion: reduce) {
      body.phone header,
      body.phone .film,
      body.phone .tools,
      body.phone nav,
      body.phone .rec-head,
      body.phone .timeline,
      body.phone .clips,
      body.phone .dl-box,
      body.phone .rec-status,
      body.phone .stage-wrap,
      body.phone .rec-player,
      body.ios-large .stage-wrap,
      body.ios-large .rec-player,
      .ios-close { transition: none; }
      .dl-progress.wait .dl-progress-bar { animation: none; width: 100%; opacity: .45; }
    }
    .cell .tag, .hud-name {
      position: absolute; z-index: 2; left: 10px; top: 10px;
      background: rgba(0,0,0,.55);
      border-radius: 999px; padding: 4px 8px; font-size: 12px;
      display: flex; gap: 6px; align-items: center;
    }
    body.tv button:focus, body.tv .stage:focus {
      outline: 3px solid var(--accent-2); outline-offset: 2px;
    }
    body.tv .btn, body.tv .chip, body.tv .shot { min-height: 48px; }
    body.tv .shot { width: 132px; }
    body.tv .thumb { height: 72px; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
    .cell .tag b, .pill {
      font-size: 10px; font-weight: 700; letter-spacing: .04em;
      color: #04130c; background: var(--live); border-radius: 999px; padding: 1px 6px;
    }
    .pill.sub { background: #c9d4ea; color: #121722; }
    .empty {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: var(--muted); font-size: 14px; text-align: center; padding: 20px;
    }

    .film, .tools, .chips, .span-row {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px 4px;
      scrollbar-width: none; flex: none;
    }
    .film::-webkit-scrollbar, .tools::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
    .shot {
      flex: 0 0 auto; width: 92px; border: 0; padding: 0; background: transparent; text-align: left; color: var(--muted);
    }
    .shot .thumb {
      height: 54px; border-radius: 10px; background: #0c0e14 center/cover no-repeat;
      border: 2px solid transparent; overflow: hidden;
    }
    .shot.on { color: var(--text); }
    .shot.on .thumb { border-color: var(--accent); }
    .shot small { display: block; margin-top: 4px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .tools { padding-top: 4px; padding-bottom: 8px; align-items: center; }
    .btn {
      flex: 0 0 auto; height: 36px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer;
    }
    .btn.on { background: var(--btn-on); border-color: var(--btn-line); color: var(--accent-2); }
    .hint { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }

    .rec-head { flex: none; padding-bottom: 4px; }
    .chips { padding-bottom: 0; }
    .chip, .span-row button {
      flex: 0 0 auto; height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
    }
    .chip.on, .span-row button.on { color: var(--text); border-color: var(--btn-line); background: var(--btn-on); }
    .rec-controls { display: flex; gap: 8px; align-items: center; padding: 6px 12px 0; flex: none; flex-wrap: wrap; }
    .rec-controls input[type="date"] {
      height: 34px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); padding: 0 10px; color-scheme: inherit;
    }
    .rec-player {
      flex: 1; min-height: 120px; margin: 8px 8px 0; border-radius: 16px; overflow: hidden;
      background: #000; position: relative; border: 1px solid var(--line); touch-action: none;
    }
    .zoom-ctl {
      position: absolute; z-index: 6; top: 8px; right: 8px;
      display: flex; gap: 6px;
    }
    .stage.grid ~ .zoom-ctl { display: none; }
    .zoom-ctl button {
      width: 44px; height: 44px; margin: 0; padding: 0; border: 0; border-radius: 22px;
      background: rgba(20, 22, 28, .78); color: #fff; font-size: 22px; line-height: 1;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    body.ios-large .zoom-ctl {
      top: calc(8px + env(safe-area-inset-top));
      right: calc(8px + env(safe-area-inset-right));
    }
    body.tv .zoom-ctl button { width: 48px; height: 48px; font-size: 24px; }
    .stage video-stream, .rec-player video-stream { transform-origin: center center; }
    .live-fs, .rec-fs { position: absolute; z-index: 7; right: 8px; bottom: 8px; }
    body.ios-large .live-fs,
    body.ios-large .rec-fs {
      right: calc(8px + env(safe-area-inset-right));
      bottom: calc(8px + env(safe-area-inset-bottom));
      opacity: 1; pointer-events: auto;
    }
    .rec-skip {
      position: absolute; z-index: 6; left: 8px; bottom: 8px;
      display: flex; gap: 8px;
    }
    .rec-skip .btn { height: 44px; min-width: 72px; padding: 0 14px; }
    body.ios-large .rec-skip {
      left: calc(8px + env(safe-area-inset-left));
      bottom: calc(8px + env(safe-area-inset-bottom));
    }
    .rec-status { flex: none; color: var(--muted); font-size: 12px; padding: 6px 14px 0; min-height: 18px; }
    #dlSave { display: inline-flex; align-items: center; text-decoration: none; }
    .dl-progress {
      flex: none; height: 10px; margin: 8px 14px 0; border-radius: 999px;
      background: var(--track); border: 1px solid var(--line); overflow: hidden;
    }
    .dl-progress-bar {
      height: 100%; width: 0; border-radius: inherit; background: #3d6ec9;
    }
    .dl-progress.wait .dl-progress-bar {
      width: 40%; animation: dl-wait 1.1s ease-in-out infinite;
    }
    @keyframes dl-wait {
      from { transform: translateX(-110%); }
      to { transform: translateX(280%); }
    }
    .dl-box {
      flex: none; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 6px 12px 0;
    }
    .dl-box label {
      display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px;
    }
    .dl-box input[type="date"], .dl-box input[type="time"] {
      height: 34px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--card); padding: 0 8px; color-scheme: inherit;
    }
    body.tv .dl-box input { min-height: 48px; }

    .timeline { flex: none; padding: 4px 14px 8px; }
    .tl-top { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .tl-bar {
      position: relative; height: 44px; border-radius: 12px; background: var(--track);
      border: 1px solid var(--line); touch-action: none; cursor: pointer;
    }
    .tl-seg {
      position: absolute; top: 14px; height: 16px; border-radius: 4px;
      background: linear-gradient(90deg, #ff7a4a, var(--rec)); min-width: 2px;
    }
    .tl-play {
      position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
      transform: translateX(-1px); pointer-events: none;
    }
    .tl-play::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px rgba(76,141,255,.35);
    }
    .tl-bubble {
      position: absolute; top: -22px; transform: translateX(-50%);
      background: #fff; color: #111; font-size: 11px; font-weight: 650;
      border-radius: 999px; padding: 2px 7px; pointer-events: none; white-space: nowrap;
    }
    .tl-labels { position: relative; height: 16px; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .tl-labels span { position: absolute; transform: translateX(-50%); }

    .clips {
      flex: none; max-height: 22vh; overflow: auto; margin: 0; padding: 0 8px 8px;
      list-style: none;
    }
    .clips li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 10px 10px; margin: 0 4px 6px; border-radius: 12px;
      background: var(--card); color: var(--text); font-size: 13px;
    }
    .clips li.active { outline: 1px solid #3d6ec9; }
    .clips li .m { color: var(--muted); font-size: 12px; }
    .clips .rec-empty { color: var(--muted); background: transparent; }

    dialog.arch {
      width: min(640px, calc(100vw - 16px));
      max-height: min(82dvh, 760px);
      margin: auto; padding: 0; color: var(--text);
      border: 1px solid var(--line); border-radius: 16px; background: var(--dialog);
    }
    dialog.arch::backdrop { background: rgba(0, 0, 0, .66); }
    .arch-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 12px 12px 0;
    }
    .arch-head strong { font-size: 16px; }
    .arch-actions { display: flex; gap: 8px; }
    .arch-status { margin: 8px 14px 0; color: var(--muted); font-size: 12px; min-height: 18px; }
    .arch-list { overflow: auto; max-height: calc(82dvh - 92px); padding: 8px 8px 14px; }
    .arch-cam { margin: 12px 6px 4px; font-size: 14px; }
    .arch-day { margin: 8px 6px 4px; color: var(--muted); font-size: 11px; }
    .arch-row {
      width: 100%; min-height: 44px; margin: 0 0 6px; padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      border: 0; border-radius: 12px; background: var(--card); color: var(--text); text-align: left;
    }
    .arch-row span:last-child { color: var(--muted); font-size: 12px; }

    nav {
      flex: none; height: var(--nav); padding-bottom: env(safe-area-inset-bottom);
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--nav-bg); border-top: 1px solid var(--line);
    }
    nav button {
      border: 0; background: transparent; color: var(--muted); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 11px; font-weight: 650;
    }
    nav button.on { color: var(--accent-2); }
    nav svg { width: 22px; height: 22px; }
  </style>
</head>
<body data-mode="live">
  <div class="app">
    <header>
      <div class="mark" aria-hidden="true"><img src="./icon.png" alt="" width="28" height="28"></div>
      <div class="titles">
        <strong id="title">Cameras</strong>
        <span id="subtitle">Live</span>
      </div>
      <label class="theme-pick"><select id="themePick" aria-label="Theme">
        <option value="night">Night</option>
        <option value="harbor">Harbor</option>
        <option value="pine">Pine</option>
        <option value="amber">Amber</option>
        <option value="day">Day</option>
      </select></label>
      <div class="clock" id="clock">--:--</div>
    </header>

    <section class="view" id="liveView">
      <div class="stage-wrap">
        <div class="stage one" id="stage" tabindex="0"></div>
        <div class="zoom-ctl" id="liveZoom">
          <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
          <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        </div>
        <button class="btn live-fs" id="liveFs" type="button">Screen</button>
      </div>
      <div class="film" id="film"></div>
      <div class="tools">
        <button class="btn on" id="btnHd" type="button">HD</button>
        <button class="btn" id="btnGrid" type="button">Mosaic</button>
        <button class="btn" id="btnMute" type="button">Mute</button>
        <button class="btn" id="btnShot" type="button">Shot</button>
        <button class="btn" id="btnFs" type="button">Screen</button>
        <span class="hint" id="liveHint">HD · 1 channel</span>
      </div>
    </section>

    <section class="view" id="recView">
      <div class="rec-head">
        <div class="chips" id="recChips"></div>
        <div class="rec-controls">
          <input type="date" id="recDate" />
          <div class="span-row" id="recSpan">
            <button type="button" data-days="1">Today</button>
            <button type="button" data-days="2" class="on">2 days</button>
            <button type="button" data-days="7">7 days</button>
          </div>
          <button class="btn" id="recSearch" type="button">Refresh</button>
          <button class="btn" id="archOpen" type="button">Archive</button>
          <button class="btn on" id="recMute" type="button">Sound</button>
        </div>
      </div>
      <div class="rec-player" id="recPlayer">
        <div class="empty" id="recPlaceholder">Drag the bar to that hour</div>
        <div class="rec-skip">
          <button class="btn" id="recBack" type="button" aria-label="Back 10 seconds" aria-keyshortcuts="ArrowLeft">−10 s</button>
          <button class="btn" id="recFwd" type="button" aria-label="Forward 10 seconds" aria-keyshortcuts="ArrowRight">+10 s</button>
        </div>
        <button class="btn rec-fs" id="recFs" type="button">Screen</button>
        <div class="zoom-ctl" id="recZoom">
          <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
          <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="rec-status" id="recStatus">The bar covers hours and days. Highest quality.</div>
      <div class="dl-box">
        <label>From <input type="date" id="dlFromDate" /><input type="time" id="dlFromTime" step="1" /></label>
        <label>To <input type="date" id="dlToDate" /><input type="time" id="dlToTime" step="1" /></label>
        <button class="btn" id="dlBtn" type="button">Download</button>
        <button class="btn" id="dlHere" type="button">1 min from here</button>
        <a class="btn" id="dlSave" hidden>Save</a>
      </div>
      <div class="dl-progress" id="dlProgress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Video download">
        <div class="dl-progress-bar" id="dlProgressBar"></div>
      </div>
      <div class="rec-status" id="dlStatus"></div>
      <div class="timeline">
        <div class="tl-top">
          <span id="tlRange">Recording</span>
          <span id="tlNow">—</span>
        </div>
        <div class="tl-bar" id="tlBar" role="slider" aria-label="Recording timeline">
          <div class="tl-play" id="tlPlay"><span class="tl-bubble" id="tlBubble">—</span></div>
        </div>
        <div class="tl-labels" id="tlLabels"></div>
      </div>
      <ul class="clips" id="clipList"></ul>
    </section>

    <button type="button" class="ios-close" id="iosClose" aria-label="Close">×</button>
    <nav>
      <button type="button" id="tabLive" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Live
      </button>
      <button type="button" id="tabRec">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>
        Recording
      </button>
    </nav>
  </div>

  <dialog class="arch" id="archDlg" aria-labelledby="archTitle">
    <div class="arch-head">
      <strong id="archTitle">Recordings on the recorder</strong>
      <div class="arch-actions">
        <button class="btn" id="archRefresh" type="button">Refresh</button>
        <button class="btn" id="archClose" type="button">Close</button>
      </div>
    </div>
    <p class="arch-status" id="archStatus">Looking up recordings…</p>
    <div class="arch-list" id="archList"></div>
  </dialog>

  <script type="module">
    const GO2RTC = (() => {
      // Same host as the page, port 1984. The Python process uses GO2RTC_URL.
      const h = location.hostname || '127.0.0.1';
      return `http://${h}:1984`;
    })();

    const THEMES = { night: '#07080c', harbor: '#061018', pine: '#07110c', amber: '#120e08', day: '#f4f1ea' };
    function applyTheme(name) {
      const theme = Object.prototype.hasOwnProperty.call(THEMES, name) ? name : 'night';
      document.documentElement.dataset.theme = theme;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', THEMES[theme]);
      try { localStorage.setItem('visor-theme', theme); } catch (err) { /* private mode */ }
      const pick = document.getElementById('themePick');
      if (pick && pick.value !== theme) pick.value = theme;
    }
    let savedTheme = 'night';
    try { savedTheme = localStorage.getItem('visor-theme') || 'night'; } catch (err) { savedTheme = 'night'; }
    applyTheme(savedTheme);
    document.getElementById('themePick').addEventListener('change', (ev) => applyTheme(ev.target.value));
    const ua = navigator.userAgent || '';
    const isIOS = (() => {
      if (/iPad|iPhone|iPod/.test(ua)) return true;
      if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
      return false;
    })();
    const isTV = new URLSearchParams(location.search).get('tv') === '1'
      || /Tizen|SMART-TV|SmartTV|Web0S|HbbTV/i.test(ua);
    // Full-range HEVC paints gray or green on Android, and cameras 3 and 4
    // also exceed the level that phone decodes. Camera 7 fits.
    const isAndroid = /Android/i.test(ua) && !isTV;
    // Large view, close, and transitions: iPhone and Android. TV and desktop
    // keep native fullscreen. Each codec path stays as it is.
    const isPhone = isIOS || isAndroid;
    // The TV cannot hold WebRTC or the H.265 main: that reconnects and stutters.
    // Substream H.264 over MSE is not transcoded. MJPEG is only the MSE fallback.
    const playMode = isTV ? 'mse,mjpeg' : (isIOS ? 'webrtc,hls,mse,mjpeg' : 'webrtc,mse,hls,mjpeg');
    if (isTV) document.body.classList.add('tv');
    if (isIOS) document.body.classList.add('ios');
    if (isPhone) document.body.classList.add('phone');
    const phoneQuery = window.matchMedia('(max-width: 800px)');

    // Recorder Ethernet is 100 Mbps. One main is about 6 Mbps and also needs
    // a transcode. Mosaic and the selector open H.264 substreams that have a picture.
    // Every 15s the page probes channels that are not on screen and adds one that appears.
    // A new camera, on the recorder or IP, is another cameras.json entry. channel
    // is set only when the recorder stores it. Without channel it stays live-only.

    await import(`${GO2RTC}/video-stream.js`);
    const cfg = await fetch('./cameras.json', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
    const cameras = (cfg && cfg.cameras) ? cfg.cameras : [];
    const streamCams = cameras.filter(c => c.type === 'stream');

    const stage = document.getElementById('stage');
    const film = document.getElementById('film');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const liveHint = document.getElementById('liveHint');
    const btnHd = document.getElementById('btnHd');
    const btnGrid = document.getElementById('btnGrid');

    let focus = Math.min(Math.max(streamCams.length - 1, 0), Math.max(0, Number(sessionStorage.getItem('camIdx') || 0)));
    let view = 'one';
    let mosaicCams = [];
    let signalCams = [];
    let gridColsNow = 2;
    let hd = isTV ? false : (sessionStorage.getItem('camHd') != null ? sessionStorage.getItem('camHd') === '1' : true);
    let probeEpoch = 0;
    let scanBusy = false;
    let signalReady = false;
    let inputLive = null;
    let muted = true;
    let recMuted = false;
    let gesture = null;
    let liveToken = 0;
    let liveEdgeTimer = 0;

    function phone() { return phoneQuery.matches; }
    function focused() { return streamCams[focus] || null; }
    function streamOf(cam, q) {
      // The HEVC main is full range and the browser paints it gray.
      // PC and phone use TV-range H.264. The TV stays on the substream.
      if (q === 'main' && cam && cam.stream_main && !isTV) {
        const hdName = String(cam.stream_main).replace(/_main$/, '_hd');
        if (hdName !== cam.stream_main) return hdName;
      }
      return q === 'main' ? cam.stream_main : cam.stream_sub;
    }
    function dvrChannel(cam) {
      const n = cam && Number(cam.channel);
      return Number.isInteger(n) && n > 0 ? n : 0;
    }
    function fitGrid(n) {
      const wide = isTV || !phone();
      let cols = n <= 1 ? 1 : 2;
      if (wide && n >= 5) cols = 3;
      if (wide && n >= 7) cols = 4;
      const rows = Math.max(1, Math.ceil(n / cols));
      gridColsNow = cols;
      stage.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      stage.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    }
    function camSrc(cam) { return (cam && (cam.stream_sub || cam.stream_main)) || ''; }
    function sortCams(list) {
      return list.slice().sort((a, b) => {
        const ca = dvrChannel(a), cb = dvrChannel(b);
        if (ca && cb && ca !== cb) return ca - cb;
        if (ca !== cb) return ca ? -1 : 1;
        return String(a.id).localeCompare(String(b.id));
      });
    }
    function inputAllows(cam) {
      if (!inputLive) return true;
      const n = dvrChannel(cam);
      if (!n) return true;
      return inputLive[String(n)] === true;
    }
    async function refreshInputs() {
      try {
        const data = await fetch('./api/inputs', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
        if (!data || !Array.isArray(data.channels)) return;
        const map = {};
        for (const ch of data.channels) map[String(ch.channel)] = !!ch.video;
        inputLive = map;
      } catch (_) {}
    }
    async function hasSignal(cam) {
      if (!inputAllows(cam)) return false;
      const src = camSrc(cam);
      if (!src) return false;
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : 0;
      try {
        const r = await fetch(`${GO2RTC}/api/frame.jpeg?src=${encodeURIComponent(src)}`, {
          cache: 'no-store',
          signal: ctrl ? ctrl.signal : undefined,
        });
        if (!r.ok) return false;
        const buf = await r.arrayBuffer();
        return buf.byteLength >= 2000;
      } catch (_) {
        return false;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }
    async function camsWithSignal(list) {
      const cams = list || streamCams;
      const checks = await Promise.all(cams.map(async (cam) => (await hasSignal(cam)) ? cam : null));
      return checks.filter(Boolean);
    }
    function snapFocusToSignal() {
      if (!signalCams.length) return;
      const cur = focused();
      if (cur && signalCams.some(c => c.id === cur.id)) return;
      const idx = streamCams.indexOf(signalCams[0]);
      if (idx < 0) return;
      focus = idx;
      sessionStorage.setItem('camIdx', String(focus));
    }
    function adoptStreams(incoming) {
      for (const cam of incoming) {
        if (!cam || cam.type !== 'stream' || !camSrc(cam) || !cam.id) continue;
        const prev = streamCams.find(c => c.id === cam.id);
        if (!prev) streamCams.push(cam);
        else Object.assign(prev, cam);
      }
    }
    async function refreshCatalog() {
      try {
        const cfg = await fetch('./cameras.json', { cache: 'no-store' }).then(r => r.json());
        adoptStreams((cfg && cfg.cameras) || []);
      } catch (_) {}
    }
    // A catalog dar wins in HD, smooth, mosaic, and Recording. Without dar, the frame uses its own pixels.
    function camDar(cam) {
      const d = cam && cam.dar;
      if (!Array.isArray(d) || d.length !== 2) return 0;
      const w = Number(d[0]), h = Number(d[1]);
      if (!(w > 0) || !(h > 0)) return 0;
      return w / h;
    }
    function frameDar(cam, video) {
      const catalog = camDar(cam);
      if (catalog > 0) return catalog;
      const vw = video && video.videoWidth;
      const vh = video && video.videoHeight;
      if (vw > 0 && vh > 0) return vw / vh;
      return 0;
    }
    function applyFrameDar(video) {
      if (!video) return;
      const box = video.closest('.cell, .rec-player');
      if (!box) return;
      const cam = box.classList.contains('rec-player')
        ? streamCams.find(c => dvrChannel(c) === recChannel)
        : streamCams.find(c => String(c.id) === box.dataset.id);
      const dar = frameDar(cam, video);
      if (!(dar > 0)) return;
      box.dataset.dar = String(dar);
      video.style.objectFit = 'fill';
      if (video.videoHeight > 0) {
        video.setAttribute('width', String(Math.round(video.videoHeight * dar)));
        video.setAttribute('height', String(video.videoHeight));
      }
      watchDar(box);
    }
    function layoutDar(box) {
      if (!box) return;
      const dar = Number(box.dataset.dar);
      const host = box.querySelector('video-stream');
      if (!host || !(dar > 0)) return;
      const cw = box.clientWidth, ch = box.clientHeight;
      if (!cw || !ch) return;
      let w = cw, h = w / dar;
      if (h > ch) { h = ch; w = h * dar; }
      host.style.setProperty('width', Math.floor(w) + 'px', 'important');
      host.style.setProperty('height', Math.floor(h) + 'px', 'important');
    }
    let darObserver = null;
    function watchDar(box) {
      if (!box || !box.dataset.dar) return;
      if (typeof ResizeObserver === 'function') {
        if (!darObserver) {
          darObserver = new ResizeObserver(entries => {
            for (const e of entries) layoutDar(e.target);
          });
        }
        darObserver.observe(box);
      }
      layoutDar(box);
      requestAnimationFrame(() => layoutDar(box));
    }
    window.addEventListener('resize', () => {
      document.querySelectorAll('[data-dar]').forEach(layoutDar);
    });
    function applyRecDar() {
      const cam = streamCams.find(c => dvrChannel(c) === recChannel);
      const dar = camDar(cam);
      if (darObserver) darObserver.unobserve(recPlayer);
      const host = recPlayer.querySelector('video-stream');
      if (!dar) {
        delete recPlayer.dataset.dar;
        if (host) {
          host.style.removeProperty('width');
          host.style.removeProperty('height');
        }
        return;
      }
      recPlayer.dataset.dar = String(dar);
      watchDar(recPlayer);
    }

    function applyVideo(vs) {
      const hook = () => {
        const v = vs.querySelector('video');
        if (!v) return false;
        v.playsInline = true;
        v.controls = false;
        v.removeAttribute('controls');
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        v.disablePictureInPicture = true;
        applyFrameDar(v);
        const darBox = v.closest('[data-dar]');
        v.style.objectFit = darBox ? 'fill' : 'contain';
        if (!v.dataset.darFit) {
          v.dataset.darFit = '1';
          v.addEventListener('loadedmetadata', () => applyFrameDar(v));
        }
        if (isPhone) bindPhoneVideo(v);
        if (isIOS) bindIosVideo(v);
        const isRec = vs.dataset.rec === '1';
        v.muted = isRec ? recMuted : muted;
        v.autoplay = true;
        if (isTV || vs.dataset.rec === '1') {
          if (isTV) v.controls = false;
          try {
            const rate = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'playbackRate');
            if (rate && rate.set && !Object.prototype.hasOwnProperty.call(v, 'playbackRate')) {
              Object.defineProperty(v, 'playbackRate', {
                configurable: true,
                get() { return rate.get.call(this); },
                set(val) { rate.set.call(this, val > 1.05 ? 1 : val); },
              });
            }
          } catch (_) {}
        }
        const started = v.play?.();
        if (started && started.catch) {
          started.catch(() => {
            if (!isRec || recMuted) return;
            recMuted = true;
            v.muted = true;
            const btn = document.getElementById('recMute');
            if (btn) {
              btn.textContent = 'Mute';
              btn.classList.remove('on');
            }
            recStatus.textContent = 'Tap Sound to hear the microphone.';
          });
        }
        return true;
      };
      if (hook()) return;
      const mo = new MutationObserver(() => { if (hook()) mo.disconnect(); });
      mo.observe(vs, { childList: true, subtree: true });
      setTimeout(() => mo.disconnect(), 8000);
    }

    function stopLive() {
      liveToken++;
      if (liveEdgeTimer) {
        clearInterval(liveEdgeTimer);
        liveEdgeTimer = 0;
      }
      if (darObserver) stage.querySelectorAll('[data-dar]').forEach(el => darObserver.unobserve(el));
      stage.querySelectorAll('video-stream').forEach(vs => {
        try { vs.ondisconnect?.(); } catch (_) {}
      });
      stage.innerHTML = '';
    }

    function armLiveEdge() {
      if (!isTV || view !== 'grid') return;
      liveEdgeTimer = setInterval(() => {
        stage.querySelectorAll('video').forEach(v => {
          if (v.readyState < 2 || !v.buffered || !v.buffered.length) return;
          const end = v.buffered.end(v.buffered.length - 1);
          if (end - v.currentTime > 1.2) {
            try { v.currentTime = Math.max(0, end - 0.35); } catch (_) {}
          }
        });
      }, 2000);
    }

    function markGrid() {
      const id = focused() && focused().id;
      stage.querySelectorAll('.cell').forEach(el => el.classList.toggle('on', el.dataset.id === id));
    }

    function addCell(cam, quality, delay) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.id = cam.id;
      const dar = camDar(cam);
      if (dar) cell.dataset.dar = String(dar);
      const name = streamOf(cam, quality);
      const vs = document.createElement('video-stream');
      vs.background = false;
      // The HEVC main does not go through WebRTC. On iPhone that case uses HLS.
      vs.mode = (isIOS && /_main$/.test(name)) ? 'hls,mp4' : playMode;
      if (isTV || view === 'grid') {
        vs.media = 'video';
        vs.visibilityCheck = false;
      }
      const token = liveToken;
      const start = () => {
        if (token !== liveToken) return;
        vs.src = new URL(`${GO2RTC}/api/ws?src=${encodeURIComponent(name)}`);
        applyVideo(vs);
      };
      if (delay) setTimeout(start, delay);
      else start();
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.innerHTML = `<span>${cam.name}</span><b class="${quality === 'main' ? '' : 'sub'}">${quality === 'main' ? 'HD' : 'Smooth'}</b>`;
      cell.append(vs, tag);
      if (view === 'grid') {
        cell.addEventListener('click', () => openOne(streamCams.indexOf(cam)));
      }
      stage.appendChild(cell);
      if (dar) watchDar(cell);
      return name;
    }

    async function renderLive() {
      if (document.body.dataset.mode !== 'live') return;
      liveZoom.reset();
      stopLive();
      const token = liveToken;
      stage.style.gridTemplateColumns = '';
      stage.style.gridTemplateRows = '';
      const cam = focused();
      stage.className = 'stage ' + (view === 'one' ? 'one' : 'grid');
      if (view !== 'grid') {
        if (!cam) {
          stage.innerHTML = '<div class="empty">No cameras</div>';
        } else {
          addCell(cam, hd ? 'main' : 'sub');
          title.textContent = cam.name;
          subtitle.textContent = isTV
            ? (hd ? 'TV · HD' : 'TV · smooth')
            : (hd ? 'Live · HD' : 'Live · smooth');
          liveHint.textContent = isTV
            ? (hd ? 'HD · 1 channel' : 'TV · 1 channel')
            : (hd ? 'HD · 1 channel' : 'Smooth · 1 channel');
        }
      } else {
        stage.innerHTML = '<div class="empty">Looking for a picture…</div>';
        probeEpoch += 1;
        const epoch = probeEpoch;
        let live = [];
        try { live = sortCams(await camsWithSignal()); } catch (_) { live = []; }
        if (token !== liveToken || epoch !== probeEpoch || document.body.dataset.mode !== 'live' || view !== 'grid') return;
        stage.innerHTML = '';
        signalCams = live;
        mosaicCams = live;
        title.textContent = 'Mosaic';
        if (!live.length) {
          stage.innerHTML = '<div class="empty">No channel has a picture</div>';
          subtitle.textContent = 'No signal';
          liveHint.textContent = 'No signal';
        } else {
          fitGrid(live.length);
          live.forEach((c, i) => addCell(c, 'sub', i * 120));
          subtitle.textContent = `Smooth · ${live.length} with picture`;
          liveHint.textContent = `Smooth · ${live.length} with picture`;
          markGrid();
          armLiveEdge();
        }
      }
      btnHd.classList.toggle('on', view === 'one' && hd);
      btnGrid.classList.toggle('on', view === 'grid');
      renderFilm();
      if (iosLarge) requestAnimationFrame(placeIosLarge);
    }

    function markFilm() {
      const id = focused() && focused().id;
      film.querySelectorAll('.shot').forEach(b => b.classList.toggle('on', b.dataset.id === id));
      const on = film.querySelector('.shot.on');
      if (on) {
        const left = on.offsetLeft - (film.clientWidth - on.clientWidth) / 2;
        film.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
      }
    }

    function renderFilm() {
      const next = signalCams.map(c => c.id).join(',');
      const now = [...film.querySelectorAll('.shot')].map(b => b.dataset.id).join(',');
      if (now === next) {
        markFilm();
        return;
      }
      film.innerHTML = '';
      signalCams.forEach((cam, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'shot';
        b.dataset.id = cam.id;
        b.innerHTML = `<div class="thumb"></div><small>${cam.name}</small>`;
        const thumb = b.querySelector('.thumb');
        b.addEventListener('click', () => openOne(streamCams.indexOf(cam)));
        film.appendChild(b);
        if (isTV) {
          thumb.textContent = cam.id;
        } else {
          const src = camSrc(cam);
          setTimeout(() => {
            if (!b.isConnected || !src) return;
            thumb.style.backgroundImage = `url("${GO2RTC}/api/frame.jpeg?src=${encodeURIComponent(src)}")`;
          }, 400 + i * 180);
        }
      });
      markFilm();
    }

    function syncMosaicCells() {
      if (view !== 'grid' || document.body.dataset.mode !== 'live') return;
      const empty = stage.querySelector('.empty');
      if (empty && signalCams.length) empty.remove();
      stage.querySelectorAll('.cell').forEach(el => {
        if (!signalCams.some(c => String(c.id) === el.dataset.id)) {
          const vs = el.querySelector('video-stream');
          try { vs && vs.ondisconnect && vs.ondisconnect(); } catch (_) {}
          el.remove();
        }
      });
      const have = new Set([...stage.querySelectorAll('.cell')].map(el => el.dataset.id));
      signalCams.forEach(cam => {
        if (!have.has(String(cam.id))) addCell(cam, 'sub', 0);
      });
      const cells = new Map([...stage.querySelectorAll('.cell')].map(el => [el.dataset.id, el]));
      signalCams.forEach(cam => {
        const cell = cells.get(String(cam.id));
        if (cell) stage.appendChild(cell);
      });
      mosaicCams = signalCams.slice();
      if (!signalCams.length) {
        stage.innerHTML = '<div class="empty">No channel has a picture</div>';
        subtitle.textContent = 'No signal';
        liveHint.textContent = 'No signal';
        return;
      }
      fitGrid(signalCams.length);
      subtitle.textContent = `Smooth · ${signalCams.length} with picture`;
      liveHint.textContent = `Smooth · ${signalCams.length} with picture`;
      markGrid();
    }

    async function watchUnused() {
      if (!signalReady || document.hidden || scanBusy) return;
      scanBusy = true;
      const epoch = probeEpoch;
      try {
        await refreshCatalog();
        await refreshInputs();
        if (epoch !== probeEpoch) return;
        const kept = signalCams.filter(inputAllows);
        const dropped = kept.length !== signalCams.length;
        signalCams = kept;
        const have = new Set(signalCams.map(c => c.id));
        const pending = streamCams.filter(c => inputAllows(c) && !have.has(c.id));
        const found = pending.length ? await camsWithSignal(pending) : [];
        if (epoch !== probeEpoch) return;
        let added = false;
        for (const cam of found) {
          if (signalCams.some(c => c.id === cam.id)) continue;
          signalCams.push(cam);
          added = true;
        }
        if (!added && !dropped) return;
        signalCams = sortCams(signalCams);
        if (dropped) snapFocusToSignal();
        renderFilm();
        if (document.body.dataset.mode === 'rec') renderRecChips();
        if (view === 'grid') syncMosaicCells();
        else if (dropped && !signalCams.some(c => focused() && c.id === focused().id)) renderLive();
      } catch (_) {
      } finally {
        scanBusy = false;

      try {
        await loadRec(Date.parse(item.start));
      } catch (_) {
        recStatus.textContent = 'The recorder could not be reached.';
      }
    }
    document.getElementById('archOpen').addEventListener('click', () => { openArchive(false); });
    document.getElementById('archRefresh').addEventListener('click', () => { openArchive(true); });
    document.getElementById('archClose').addEventListener('click', () => { archDlg.close(); });

    document.addEventListener('visibilitychange', () => {
      if (isTV) return;
      if (document.hidden) {
        stopLive();
        if (recVs) { try { recVs.src = ''; } catch (_) {} }
        return;
      }
      if (document.body.dataset.mode === 'live') renderLive();
      else if (recPlayFrom != null && recData) {
        const hit = snap(recPlayFrom);
        if (hit) playAt(hit);
      }
      watchUnused();
    });

    function tick() {
      const p = bogotaParts(new Date());
      document.getElementById('clock').textContent = p.h + ':' + p.min;
    }
    tick();
    setInterval(tick, 1000);
    setInterval(() => { watchUnused().catch(() => {}); }, 15000);
    probeEpoch += 1;
    const bootEpoch = probeEpoch;
    let bootFound = [];
    try { await refreshInputs(); } catch (_) {}
    try { bootFound = sortCams(await camsWithSignal()); } catch (_) { bootFound = []; }
    if (bootEpoch === probeEpoch) {
      signalCams = bootFound;
      snapFocusToSignal();
      renderLive();
      if (document.body.dataset.mode === 'rec') renderRecChips();
    }
    signalReady = true;
    if (isTV) stage.focus();
  </script>
</body>
</html>
